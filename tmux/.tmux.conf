# ~/.tmux.conf

#  prefix 
unbind C-b
set -g prefix C-a
bind C-a send-prefix

#  general options 
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g mouse on
set -g history-limit 10000
set -sg escape-time 10

#  window/pane indexing 
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g allow-rename on

#  key bindings 
# reload config
bind r source-file ~/.tmux.conf \; display ".tmux.conf reloaded."

# pane splits, keep current path
unbind %
bind | split-window -h -c "#{pane_current_path}"
unbind '"'
bind - split-window -v -c "#{pane_current_path}"

# new window in current path, opens next to current window
bind c new-window -c "#{pane_current_path}" -a -t "{next}"

# pane navigation, vim-style keys
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

#  copy mode 
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-clipboard

# status bar 
